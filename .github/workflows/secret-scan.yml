name: Secret scan
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Our own check (every tracked file)
        run: node scripts/check-secrets.mjs --all
      - name: TruffleHog (whole history, verified secrets)
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown
